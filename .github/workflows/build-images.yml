name: Build Ubuntu 24.04 LTS GNOME Image for Xiaomi Pad 5 (nabu)

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 2"

jobs:
  build-ubuntu-base-image:
    name: Build Ubuntu Base Rootfs
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Update apt cache
        run: |
          sudo apt-get update

      - name: Install build dependencies
        run: |
          sudo apt-get install -y \
            git wget debootstrap qemu-user-static \
            e2fsprogs pigz arch-install-scripts \
            parted dosfstools gpg curl

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Create and initialize image file
        run: |
          echo "::group::Create blank image"
          truncate -s 20G ./ubuntu-rootfs.img
          echo "::endgroup::"

          echo "::group::Partition image"
          parted -s ./ubuntu-rootfs.img mklabel gpt
          parted -s ./ubuntu-rootfs.img mkpart ESP fat32 1MiB 513MiB
          parted -s ./ubuntu-rootfs.img set 1 esp on
          parted -s ./ubuntu-rootfs.img mkpart primary ext4 513MiB 100%
          echo "::endgroup::"

          echo "::group::Setup loop device and format partitions"
          LOOP_DEV=$(sudo losetup -f --show ./ubuntu-rootfs.img)
          sudo partprobe $LOOP_DEV
          sudo mkfs.vfat -F32 ${LOOP_DEV}p1 -n ESP
          sudo mkfs.ext4 ${LOOP_DEV}p2 -L rootfs
          echo "LOOP_DEV=$LOOP_DEV" >> $GITHUB_ENV
          echo "::endgroup::"

          echo "::group::Mount partitions"
          mkdir -p ./mountpoint
          sudo mount ${LOOP_DEV}p2 ./mountpoint
          sudo mkdir -p ./mountpoint/boot/efi
          sudo mount ${LOOP_DEV}p1 ./mountpoint/boot/efi
          echo "::endgroup::"

      - name: Bootstrap Ubuntu 24.04 LTS base system
        run: |
          echo "::group::Run first-stage debootstrap"
          sudo debootstrap \
            --arch=arm64 \
            --components=main,universe,restricted,multiverse \
            --include=apt-transport-https,ca-certificates,gnupg2,software-properties-common \
            noble ./mountpoint https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports
          echo "::endgroup::"

          echo "::group::Mount kernel filesystems for chroot"
          sudo mount -t proc /proc ./mountpoint/proc
          sudo mount -t sysfs /sys ./mountpoint/sys
          sudo mount -o bind /dev ./mountpoint/dev
          sudo mount -o bind /dev/pts ./mountpoint/dev/pts
          echo "::endgroup::"

      - name: Configure Ubuntu base system
        shell: bash
        run: |
          sudo chroot ./mountpoint bash - <<'EOF'
          set -e
          echo "::group::Configure apt sources"
          cat > /etc/apt/sources.list <<'APT'
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports noble main restricted universe multiverse
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports noble-updates main restricted universe multiverse
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports noble-backports main restricted universe multiverse
          deb https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports noble-security main restricted universe multiverse
          APT
          apt update -y
          echo "::endgroup::"

          echo "::group::Set locale and timezone"
          apt install -y locales tzdata
          locale-gen en_US.UTF-8
          update-locale LANG=en_US.UTF-8
          ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          dpkg-reconfigure -f noninteractive tzdata
          echo "::endgroup::"

          echo "::group::Configure hostname and hosts"
          echo "ubuntu-nabu" > /etc/hostname
          cat > /etc/hosts <<'HOSTS'
          127.0.0.1   localhost
          127.0.1.1   ubuntu-nabu
          ::1         localhost ip6-localhost ip6-loopback
          ff02::1     ip6-allnodes
          ff02::2     ip6-allrouters
          HOSTS
          echo "::endgroup::"

          echo "::group::Configure sudo and default user"
          apt install -y sudo
          echo "%sudo ALL=(ALL:ALL) ALL" > /etc/sudoers.d/10-sudo-group
          useradd -m -s /bin/bash -G sudo,audio,video,netdev,bluetooth,input ubuntu
          echo "ubuntu:ubuntu" | chpasswd
          echo "::endgroup::"

          echo "::group::Enable systemd services"
          systemctl enable systemd-networkd systemd-resolved
          echo "::endgroup::"
          EOF

      - name: Install nabu hardware adaptation components
        shell: bash
        run: |
          sudo chroot ./mountpoint bash - <<'EOF'
          set -e
          echo "::group::Install core system utilities"
          apt install -y \
            linux-firmware network-manager bluez bluez-utils \
            pulseaudio pipewire pipewire-pulse pipewire-alsa pipewire-jack \
            alsa-ucm-conf alsa-utils wpasupplicant iw \
            zram-tools u-boot-tools grub-efi-arm64 efivar \
            rmtfs tqftpserv pd-mapper qrtr-tools
          echo "::endgroup::"

          echo "::group::Add nabu custom kernel PPA & install kernel"
          add-apt-repository -y ppa:mikhailnov/xiaomi-nabu
          apt update -y
          apt install -y linux-image-nabu linux-headers-nabu
          echo "::endgroup::"

          echo "::group::Install nabu specific firmware and configs"
          apt install -y alsa-ucm-conf-xiaomi-nabu xiaomi-nabu-bootlogo
          systemctl enable rmtfs tqftpserv pd-mapper
          echo "::endgroup::"

          echo "::group::Configure bootloader (GRUB)"
          grub-install --target=arm64-efi --efi-directory=/boot/efi --bootloader-id=ubuntu --removable
          sed -i 's/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash splash=silent console=tty0 fbcon=rotate:1"/g' /etc/default/grub
          update-grub
          echo "::endgroup::"

          echo "::group::Configure zram"
          cat > /etc/default/zramswap <<'ZRAM'
          ALGO=zstd
          PERCENT=50
          PRIORITY=100
          ZRAM
          systemctl enable zramswap
          echo "::endgroup::"
          EOF

      - name: Apply base overlay (custom configs)
        run: |
          if [ -d ./main/base/overlay ]; then
            sudo cp -r ./main/base/overlay/* ./mountpoint/
            if [ -f ./mountpoint/overlay-post-apply ]; then
              sudo chroot ./mountpoint bash -c "chmod +x /overlay-post-apply && /overlay-post-apply && rm /overlay-post-apply"
            fi
          fi

      - name: Full system upgrade & cleanup
        shell: bash
        run: |
          sudo chroot ./mountpoint bash - <<'EOF'
          set -e
          apt full-upgrade -y
          apt autoremove --purge -y
          apt clean -y
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          EOF

      - name: Unmount partitions and release loop device
        if: always()
        run: |
          echo "::group::Unmount filesystems"
          sudo umount -R ./mountpoint/proc || true
          sudo umount -R ./mountpoint/sys || true
          sudo umount -R ./mountpoint/dev/pts || true
          sudo umount -R ./mountpoint/dev || true
          sudo umount -R ./mountpoint/boot/efi || true
          sudo umount -R ./mountpoint || true
          echo "::endgroup::"

          echo "::group::Detach loop device"
          if [ -n "$LOOP_DEV" ]; then
            sudo losetup -d $LOOP_DEV || true
          fi
          echo "::endgroup::"

      - name: Shrink and compress base image
        run: |
          echo "::group::Shrink rootfs partition"
          e2fsck -f -y ubuntu-rootfs.img
          resize2fs -M ubuntu-rootfs.img
          echo "::endgroup::"

          echo "::group::Compress image"
          pigz -9 ubuntu-rootfs.img
          echo "::endgroup::"

      - name: Upload base rootfs artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-noble-nabu-base-rootfs
          path: ./ubuntu-rootfs.img.gz
          retention-days: 90
          compression-level: 0

  build-ubuntu-gnome-image:
    name: Build Ubuntu 24.04 GNOME Image
    runs-on: ubuntu-24.04-arm
    needs: build-ubuntu-base-image
    steps:
      - name: Update apt cache
        run: |
          sudo apt-get update

      - name: Install dependencies
        run: |
          sudo apt-get install -y \
            git wget e2fsprogs pigz parted dosfstools arch-install-scripts

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Download base rootfs artifact
        uses: actions/download-artifact@v4
        with:
          name: ubuntu-noble-nabu-base-rootfs

      - name: Decompress and expand base image
        run: |
          echo "::group::Decompress image"
          pigz -d ubuntu-rootfs.img.gz
          echo "::endgroup::"

          echo "::group::Expand image to 20G"
          truncate -s 20G ./ubuntu-rootfs.img
          e2fsck -f -y ubuntu-rootfs.img
          resize2fs ubuntu-rootfs.img
          echo "::endgroup::"

      - name: Mount image partitions
        run: |
          echo "::group::Setup loop device"
          LOOP_DEV=$(sudo losetup -f --show ./ubuntu-rootfs.img)
          sudo partprobe $LOOP_DEV
          echo "LOOP_DEV=$LOOP_DEV" >> $GITHUB_ENV
          echo "::endgroup::"

          echo "::group::Mount partitions"
          mkdir -p ./mountpoint
          sudo mount ${LOOP_DEV}p2 ./mountpoint
          sudo mount ${LOOP_DEV}p1 ./mountpoint/boot/efi
          echo "::endgroup::"

          echo "::group::Mount kernel filesystems"
          sudo mount -t proc /proc ./mountpoint/proc
          sudo mount -t sysfs /sys ./mountpoint/sys
          sudo mount -o bind /dev ./mountpoint/dev
          sudo mount -o bind /dev/pts ./mountpoint/dev/pts
          echo "::endgroup::"

      - name: Install GNOME Desktop Environment
        shell: bash
        run: |
          sudo chroot ./mountpoint bash - <<'EOF'
          set -e
          echo "::group::Install Ubuntu GNOME desktop components"
          apt update -y
          apt install -y \
            ubuntu-desktop-minimal \
            gdm3 nautilus gnome-console gnome-control-center \
            gnome-system-monitor gnome-tweaks gnome-shell-extensions \
            firefox noto-fonts-cjk noto-fonts-emoji \
            xdg-desktop-portal-gnome xdg-user-dirs-gtk \
            mesa-vulkan-drivers mesa-freedreno-drivers vulkan-tools
          echo "::endgroup::"

          echo "::group::Configure GNOME and GDM"
          systemctl enable gdm3 NetworkManager bluetooth
          # Fix tablet rotation and touch
          echo "LIBINPUT_CALIBRATION_MATRIX=1 0 0 0 1 0" >> /etc/environment
          # Set default GNOME settings
          sudo -u ubuntu dconf write /org/gnome/desktop/interface/text-scaling-factor 1.25
          sudo -u ubuntu dconf write /org/gnome/settings-daemon/plugins/power/sleep-inactive-ac-type 'nothing'
          sudo -u ubuntu dconf write /org/gnome/settings-daemon/plugins/power/sleep-inactive-battery-type 'suspend'
          echo "::endgroup::"
          EOF

      - name: Apply GNOME custom overlay
        run: |
          if [ -d ./main/gnome/overlay ]; then
            sudo cp -r ./main/gnome/overlay/* ./mountpoint/
            if [ -f ./mountpoint/overlay-post-apply ]; then
              sudo chroot ./mountpoint bash -c "chmod +x /overlay-post-apply && /overlay-post-apply && rm /overlay-post-apply"
            fi
          fi

      - name: System cleanup
        shell: bash
        run: |
          sudo chroot ./mountpoint bash - <<'EOF'
          set -e
          apt autoremove --purge -y
          apt clean -y
          rm -rf /var/lib/apt/lists/* /tmp/* /var/tmp/*
          EOF

      - name: Unmount partitions and release loop device
        if: always()
        run: |
          echo "::group::Unmount filesystems"
          sudo umount -R ./mountpoint/proc || true
          sudo umount -R ./mountpoint/sys || true
          sudo umount -R ./mountpoint/dev/pts || true
          sudo umount -R ./mountpoint/dev || true
          sudo umount -R ./mountpoint/boot/efi || true
          sudo umount -R ./mountpoint || true
          echo "::endgroup::"

          echo "::group::Detach loop device"
          if [ -n "$LOOP_DEV" ]; then
            sudo losetup -d $LOOP_DEV || true
          fi
          echo "::endgroup::"

      - name: Shrink and compress GNOME image
        run: |
          echo "::group::Shrink rootfs"
          e2fsck -f -y ubuntu-rootfs.img
          resize2fs -M ubuntu-rootfs.img
          echo "::endgroup::"

          echo "::group::Compress image"
          pigz -9 ubuntu-rootfs.img
          echo "::endgroup::"

      - name: Upload GNOME image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-24.04-noble-nabu-gnome
          path: ./ubuntu-rootfs.img.gz
          retention-days: 90
          compression-level: 0

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    needs:
      - build-ubuntu-base-image
      - build-ubuntu-gnome-image

    steps:
      - name: Get build date
        id: date
        run: |
          echo "date=$(date +'%d.%m.%Y')" >> $GITHUB_OUTPUT
          echo "date-tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create formal release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.date.outputs.date-tag }}
          target_commitish: ${{ github.sha }}
          name: Ubuntu 24.04 LTS for Xiaomi Pad 5 (nabu) - Build ${{ steps.date.outputs.date }}
          draft: false
          prerelease: false
          body: |
            Ubuntu 24.04 LTS (Noble Numbat) 镜像构建包，适配小米平板5 (nabu)
            ## 镜像内容
            - Base 基础镜像：最小化Ubuntu系统，包含硬件适配，无桌面环境
            - GNOME 桌面镜像：完整Ubuntu GNOME桌面环境，开箱即用
            ## 构建信息
            构建日期：${{ steps.date.outputs.date }}
            内核版本：nabu专用定制内核
            系统版本：Ubuntu 24.04 LTS aarch64
            ## 下载说明
            镜像文件可在本次Workflow运行的Artifacts区域下载
            下载链接：[Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})